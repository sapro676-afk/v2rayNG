name: Android emulator smoke

on:
  workflow_dispatch:
  push:
    branches:
      - olcrtc-fallback
      - olcbox-sidecar
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "V2rayNG/app/**"

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "13114758"
          packages: "platforms;android-36.1 build-tools;36.1.0 platform-tools emulator"

      - name: Install NDK
        run: |
          set -euo pipefail
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r "$GITHUB_WORKSPACE/libs" "$GITHUB_WORKSPACE/V2rayNG/app"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Checkout olcRTC
        uses: actions/checkout@v4
        with:
          repository: openlibrecommunity/olcrtc
          ref: ${{ vars.OLCRTC_REF || 'refactor/universal-carrier' }}
          path: olcrtc
          submodules: recursive

      - name: Install gomobile
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cd "$GITHUB_WORKSPACE/olcrtc"
          gomobile init

      - name: Prepare bundled olcRTC fallback profile
        env:
          ABUMBA_FALLBACK_JSON_B64: ${{ secrets.ABUMBA_FALLBACK_JSON_B64 }}
        run: |
          set -euo pipefail
          test -n "$ABUMBA_FALLBACK_JSON_B64"
          mkdir -p "$GITHUB_WORKSPACE/V2rayNG/app/src/main/assets/olcrtc"
          printf '%s' "$ABUMBA_FALLBACK_JSON_B64" \
            | base64 -d \
            > "$GITHUB_WORKSPACE/V2rayNG/app/src/main/assets/olcrtc/abumba_video_fallback.json"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            V2rayNG/*.gradle.kts
            V2rayNG/gradle/**/*.toml
            V2rayNG/gradle/wrapper/gradle-wrapper.properties

      - name: Build fdroid debug x86_64 APK
        env:
          OLCRTC_KEY: ${{ secrets.OLCRTC_KEY }}
          OLCRTC_ROOM_ID: ${{ secrets.OLCRTC_ROOM_ID }}
          OLCRTC_CLIENT_ID: ${{ secrets.OLCRTC_CLIENT_ID }}
          OLCRTC_CARRIER: ${{ vars.OLCRTC_CARRIER || 'wbstream' }}
          OLCRTC_TRANSPORT: ${{ vars.OLCRTC_TRANSPORT || 'vp8channel' }}
          OLCRTC_LINK: ${{ vars.OLCRTC_LINK || 'direct' }}
          OLCRTC_REPO: ${{ github.workspace }}/olcrtc
          ANDROID_LIB_XRAY_REPO: ${{ github.workspace }}/AndroidLibXrayLite
        run: |
          set -euo pipefail
          test -n "$OLCRTC_KEY"
          test -n "$OLCRTC_ROOM_ID"
          cd "$GITHUB_WORKSPACE/V2rayNG"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon assembleFdroidDebug -PABI_FILTERS=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare emulator artifact directory
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/emulator-artifacts"
          date -Is > "$GITHUB_WORKSPACE/emulator-artifacts/created-at.txt"

      - name: Run emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p "$GITHUB_WORKSPACE/emulator-artifacts"
            cp "$(find "$GITHUB_WORKSPACE/V2rayNG/app/build/outputs/apk/fdroid/debug" -name '*.apk' -print -quit)" "$GITHUB_WORKSPACE/emulator-artifacts/"
            adb install -r "$(find "$GITHUB_WORKSPACE/V2rayNG/app/build/outputs/apk/fdroid/debug" -name '*.apk' -print -quit)"
            adb shell pm list packages com.v2ray.ang.olcrtc | tee "$GITHUB_WORKSPACE/emulator-artifacts/packages.txt"
            adb shell monkey -p com.v2ray.ang.olcrtc -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell am broadcast -a com.v2ray.ang.olcrtc.action.OLCRTC_DEBUG_START -n com.v2ray.ang.olcrtc/com.v2ray.ang.olcrtc.OlcRtcDebugReceiver | tee "$GITHUB_WORKSPACE/emulator-artifacts/debug-start-broadcast.txt"
            sleep 20
            adb shell am broadcast -a com.v2ray.ang.olcrtc.action.OLCRTC_DEBUG_STOP -n com.v2ray.ang.olcrtc/com.v2ray.ang.olcrtc.OlcRtcDebugReceiver | tee "$GITHUB_WORKSPACE/emulator-artifacts/debug-stop-broadcast.txt" || true
            adb exec-out run-as com.v2ray.ang.olcrtc cat files/olcrtc.log > "$GITHUB_WORKSPACE/emulator-artifacts/olcrtc.log" || true
            adb logcat -d -v time > "$GITHUB_WORKSPACE/emulator-artifacts/logcat.txt" || true
            adb shell dumpsys package com.v2ray.ang.olcrtc > "$GITHUB_WORKSPACE/emulator-artifacts/package-dumpsys.txt" || true
            olcrtc_log="$GITHUB_WORKSPACE/emulator-artifacts/olcrtc.log"
            logcat="$GITHUB_WORKSPACE/emulator-artifacts/logcat.txt"
            carrier_re='carrier auth failed|join room failed|could not dial signal connection|transport connect'

            test -s "$olcrtc_log"
            grep -q "starting mobile sidecar" "$olcrtc_log"
            ! grep -E "UnsatisfiedLinkError|NoClassDefFoundError|JNI DETECTED ERROR|dlopen failed" "$olcrtc_log" "$logcat"

            if grep -q "SOCKS listener is ready on 127.0.0.1:18080" "$olcrtc_log"; then
              echo "olcRTC SOCKS listener opened"
            elif grep -Eq "$carrier_re" "$olcrtc_log"; then
              echo "olcRTC reached carrier and was rejected by external room/auth state"
            else
              cat "$olcrtc_log"
              exit 1
            fi

            if grep -q "debug receiver start failed" "$olcrtc_log" && ! grep -Eq "$carrier_re" "$olcrtc_log"; then
              cat "$olcrtc_log"
              exit 1
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-olcrtc-emulator-diagnostics
          path: ${{ github.workspace }}/emulator-artifacts/
          if-no-files-found: warn
