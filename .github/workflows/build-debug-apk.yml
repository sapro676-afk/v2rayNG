name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - olcrtc-fallback
      - olcbox-sidecar

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "13114758"
          packages: "platforms;android-36.1 build-tools;36.1.0 platform-tools"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Restore cached libhevtun
        id: cache-libhevtun-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Save libhevtun
        if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/libs
          key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

      - name: Copy libhevtun
        run: cp -r "$GITHUB_WORKSPACE/libs" "$GITHUB_WORKSPACE/V2rayNG/app"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Checkout olcRTC
        uses: actions/checkout@v4
        with:
          repository: openlibrecommunity/olcrtc
          ref: ${{ vars.OLCRTC_REF || 'refactor/universal-carrier' }}
          path: olcrtc
          submodules: recursive

      - name: Install gomobile
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cd "$GITHUB_WORKSPACE/olcrtc"
          gomobile init

      - name: Prepare bundled olcRTC fallback profile
        env:
          ABUMBA_FALLBACK_JSON_B64: ${{ secrets.ABUMBA_FALLBACK_JSON_B64 }}
        run: |
          set -euo pipefail
          test -n "$ABUMBA_FALLBACK_JSON_B64"
          mkdir -p "$GITHUB_WORKSPACE/V2rayNG/app/src/main/assets/olcrtc"
          printf '%s' "$ABUMBA_FALLBACK_JSON_B64" \
            | base64 -d \
            > "$GITHUB_WORKSPACE/V2rayNG/app/src/main/assets/olcrtc/abumba_video_fallback.json"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            V2rayNG/*.gradle.kts
            V2rayNG/gradle/**/*.toml
            V2rayNG/gradle/wrapper/gradle-wrapper.properties

      - name: Build fdroid debug arm APKs
        env:
          OLCRTC_KEY: ${{ secrets.OLCRTC_KEY }}
          OLCRTC_ROOM_ID: ${{ secrets.OLCRTC_ROOM_ID }}
          OLCRTC_CLIENT_ID: ${{ secrets.OLCRTC_CLIENT_ID }}
          OLCRTC_CARRIER: ${{ vars.OLCRTC_CARRIER || 'wbstream' }}
          OLCRTC_TRANSPORT: ${{ vars.OLCRTC_TRANSPORT || 'vp8channel' }}
          OLCRTC_LINK: ${{ vars.OLCRTC_LINK || 'direct' }}
          OLCRTC_REPO: ${{ github.workspace }}/olcrtc
          ANDROID_LIB_XRAY_REPO: ${{ github.workspace }}/AndroidLibXrayLite
        run: |
          set -euo pipefail
          test -n "$OLCRTC_KEY"
          test -n "$OLCRTC_ROOM_ID"
          cd "$GITHUB_WORKSPACE/V2rayNG"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon assembleFdroidDebug -PABI_FILTERS='arm64-v8a;armeabi-v7a' -PUNIVERSAL_APK=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayng-olcrtc-fdroid-debug-arm64
          path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
